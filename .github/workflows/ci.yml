name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: python -m unittest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t uptime-monitor .
      - name: Smoke test (config loads, history is writable)
        run: |
          cp config.example.toml config.toml
          docker volume create uptime-data
          docker run --rm -v "$PWD/config.toml:/app/config.toml:ro" -v uptime-data:/app/data \
            uptime-monitor python -m uptime_monitor --config /app/config.toml --stats
          docker run --rm -v uptime-data:/app/data uptime-monitor ls -l /app/data/uptime.db
